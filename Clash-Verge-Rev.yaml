# Clash Verge Rev 订阅扩展配置
# 与机场订阅配合使用。保留订阅中的节点，替换策略组、规则集和分流规则。
# 地区节点每10分钟检测，跨地区故障切换每5分钟。未匹配流量默认直连。
# 在订阅卡片中选择“扩展配置”，关联本文件。
proxy-groups:
- name: 自动-新加坡
  type: url-test
  include-all: true
  filter: '^(?!.*(?:剩余流量|距离下次重置|套餐到期)).*(?:新加坡|🇸🇬|Singapore)'
  interval: 600
  tolerance: 100
  lazy: true
- name: 自动-美国
  type: url-test
  include-all: true
  filter: '^(?!.*(?:剩余流量|距离下次重置|套餐到期)).*(?:美国|🇺🇸|United States)'
  interval: 600
  tolerance: 100
  lazy: true
- name: 自动-日本
  type: url-test
  include-all: true
  filter: '^(?!.*(?:剩余流量|距离下次重置|套餐到期)).*(?:日本|🇯🇵|Japan)'
  interval: 600
  tolerance: 100
  lazy: true
- name: 自动-台湾
  type: url-test
  include-all: true
  filter: '^(?!.*(?:剩余流量|距离下次重置|套餐到期)).*(?:台湾|台灣|🇹🇼|Taiwan)'
  interval: 600
  tolerance: 100
  lazy: true
- name: 地区-新加坡
  type: select
  include-all: true
  filter: '^(?!.*(?:剩余流量|距离下次重置|套餐到期)).*(?:新加坡|🇸🇬|Singapore)'
  proxies:
  - 自动-新加坡
  interval: 600
  lazy: true
- name: 地区-美国
  type: select
  include-all: true
  filter: '^(?!.*(?:剩余流量|距离下次重置|套餐到期)).*(?:美国|🇺🇸|United States)'
  proxies:
  - 自动-美国
  interval: 600
  lazy: true
- name: 新加坡优先-网络故障切换
  type: fallback
  proxies:
  - 自动-新加坡
  - 自动-美国
  interval: 300
  lazy: true
- name: 服务-ChatGPT
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 服务-Claude
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 服务-Google
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 服务-YouTube
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 服务-GitHub
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 服务-社交与通信
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 服务-Netflix
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 服务-Spotify
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 服务-其他外网
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 服务-Migoo
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 服务-Muse
  type: select
  proxies:
  - 地区-美国
  - 地区-新加坡
- name: 未匹配流量
  type: select
  proxies:
  - DIRECT
  - 服务-其他外网
- name: 地区-日本
  type: select
  include-all: true
  filter: '^(?!.*(?:剩余流量|距离下次重置|套餐到期)).*(?:日本|🇯🇵|Japan)'
  proxies:
  - 自动-日本
  interval: 600
  lazy: true
- name: 地区-台湾
  type: select
  include-all: true
  filter: '^(?!.*(?:剩余流量|距离下次重置|套餐到期)).*(?:台湾|台灣|🇹🇼|Taiwan)'
  proxies:
  - 自动-台湾
  interval: 600
  lazy: true
- name: 美国网站
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
- name: 日本网站
  type: select
  proxies:
  - 地区-日本
  - 新加坡优先-网络故障切换
- name: 台湾网站
  type: select
  proxies:
  - 地区-台湾
  - 新加坡优先-网络故障切换
- name: 开发服务
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 协作与云盘
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 其他AI
  type: select
  proxies:
  - 新加坡优先-网络故障切换
  - 地区-美国
  - 地区-新加坡
- name: 美国限定服务
  type: select
  proxies:
  - 地区-美国
  - 新加坡优先-网络故障切换
