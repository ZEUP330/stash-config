# Shadowrocket 地区与服务分流；节点订阅须在首页单独导入。
# 省电设置：地区测速60分钟；故障检测30分钟；无定时脚本、MitM或改写。
# 地区限制不会触发网络故障切换，须手动切换服务策略。
[General]
update-url = https://raw.githubusercontent.com/ZEUP330/stash-config/main/Shadowrocket-Complete.conf
dns-server = system
ipv6 = true

[Proxy Group]
自动-新加坡 = url-test,policy-regex-filter=新加坡|🇸🇬|Singapore,url=http://www.gstatic.com/generate_204,interval=3600,timeout=5,tolerance=100
自动-美国 = url-test,policy-regex-filter=美国|🇺🇸|United States,url=http://www.gstatic.com/generate_204,interval=3600,timeout=5,tolerance=100
自动-日本 = url-test,policy-regex-filter=日本|🇯🇵|Japan,url=http://www.gstatic.com/generate_204,interval=3600,timeout=5,tolerance=100
自动-台湾 = url-test,policy-regex-filter=台湾|台灣|🇹🇼|Taiwan,url=http://www.gstatic.com/generate_204,interval=3600,timeout=5,tolerance=100
地区-新加坡 = select,自动-新加坡,policy-regex-filter=新加坡|🇸🇬|Singapore
地区-美国 = select,自动-美国,policy-regex-filter=美国|🇺🇸|United States
新加坡优先-网络故障切换 = fallback,地区-新加坡,地区-美国,url=http://www.gstatic.com/generate_204,interval=1800,timeout=5,tolerance=100
服务-ChatGPT = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
服务-Claude = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
服务-Google = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
服务-YouTube = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
服务-GitHub = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
服务-社交与通信 = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
服务-Netflix = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
服务-Spotify = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
服务-其他外网 = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
服务-Migoo = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
服务-Muse = select,地区-美国,地区-新加坡
未匹配流量 = select,DIRECT,服务-其他外网
地区-日本 = select,自动-日本,policy-regex-filter=日本|🇯🇵|Japan
地区-台湾 = select,自动-台湾,policy-regex-filter=台湾|台灣|🇹🇼|Taiwan
美国网站 = select,新加坡优先-网络故障切换,地区-美国
日本网站 = select,地区-日本,新加坡优先-网络故障切换
台湾网站 = select,地区-台湾,新加坡优先-网络故障切换
开发服务 = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
协作与云盘 = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
其他AI = select,新加坡优先-网络故障切换,地区-美国,地区-新加坡
美国限定服务 = select,地区-美国,新加坡优先-网络故障切换

